<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>World Explorer</title>
</head>
<body class="bg-gray-100 text-gray-800">
    <header class="bg-white shadow p-4">
        <h1 class="text-2xl font-bold">World Explorer</h1>
    </header>

     <section class="p-4 flex flex-col sm:flex-row-gap-3">
        <input id="search" type="text" placeholder="Search by country name..." class="flex-1 border rounded px-3 py-2 bg-white">
        <select id="region" class="border rounded px-3 py-2 bg-white">
            <option value="all">All Regions</option>
            </select>
        <select id="sort" class="border rounded px-3 py-2 bg-white">
            <option value="name">Name (A-Z)</option>
            <option value="population-desc">Population (High to Low)</option>
            <option value="population-asc">Population (Low to High)</option>
            <option value="area-desc">Area (Largest first)</option>
        </select>
        <label class="flex items-center gap-2 bg-white border rounded px-3 py-2">
            <input id="fav-only" type="checkbox">
            Favorites Only
        </label>
        <button id="refresh" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 active:bg-blue-800">Refresh</button>

      </section>
    <main id="app" class="p-4">
     
    </main>
<script type="module" src="js/app.js"></script>
    
</body>
</html>
